<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rainbow Books — Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/33.jpg" alt="Logo" class="me-2 logo">
        <div>
          <div class="brand-title">Rainbow Books</div>
          <small class="brand-sub">Books at the end of the rainbow</small>
        </div>
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMain3">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain3">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="bookstore.html">Bookstore</a></li>
          <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="publishing.html">Publishing</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-3">
            <a class="btn btn-outline-primary" href="checkout.html">Cart <span id="cart-count-3" class="badge bg-primary ms-1">0</span></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <h2 class="h5 mb-3">Upcoming Events</h2>

    <div id="eventsList" class="row g-3">
      <!-- JS will populate events -->
    </div>

    <!-- Registration modal -->
    <div class="modal fade" id="eventModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="eventModalTitle" class="modal-title">Event</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="eventModalDesc"></p>
            <form id="eventRegForm" onsubmit="event.preventDefault(); registerForEvent();">
              <div class="mb-3">
                <label class="form-label small">Your name</label>
                <input id="regName" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Email</label>
                <input id="regEmail" type="email" class="form-control" required>
              </div>
              <div class="text-end">
                <button class="btn btn-primary">Register (prototype)</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="site-footer bg-white py-4 border-top">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <strong>Rainbow Books</strong> — Melbourne, VIC<br>
        <small class="text-muted">© <span id="year3"></span> Rainbow Books (prototype)</small>
      </div>
      <div>
        <a href="#" class="me-3 small">Privacy</a>
        <a href="#" class="small">Terms</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('year3').textContent = new Date().getFullYear();
    initEvents();
  </script>
</body>
</html>
