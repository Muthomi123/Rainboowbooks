<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rainbow Books — Bookstore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header (same nav) -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/33.jpg" alt="Logo" class="me-2 logo">
        <div>
          <div class="brand-title">Rainbow Books</div>
          <small class="brand-sub">Books at the end of the rainbow</small>
        </div>
      </a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMain2">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain2">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="bookstore.html">Bookstore</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="publishing.html">Publishing</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-3">
            <a class="btn btn-outline-primary" href="checkout.html">
              Cart <span id="cart-count-2" class="badge bg-primary ms-1">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row">
      <!-- Filters -->
      <aside class="col-lg-3 mb-4">
        <div class="card p-3">
          <h5 class="h6">Search</h5>
          <input id="searchInput" class="form-control mb-3" placeholder="Search title or author">
          <h6 class="small">Category</h6>
          <select id="categoryFilter" class="form-select mb-3">
            <option value="">All</option>
            <option>Fiction</option>
            <option>Non-Fiction</option>
            <option>Children</option>
            <option>Young Adult</option>
          </select>
          <button class="btn btn-outline-secondary w-100" id="clearFilters">Clear</button>
        </div>
      </aside>

      <!-- Product grid -->
      <section class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="h5 mb-0">Bookstore</h3>
          <div><small id="resultsCount" class="text-muted"></small></div>
        </div>

        <div id="productGrid" class="row g-3">
          <!-- JS injects product cards -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer bg-white py-4 border-top">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <strong>Rainbow Books</strong> — Melbourne, VIC<br>
        <small class="text-muted">© <span id="year2"></span> Rainbow Books (prototype)</small>
      </div>
      <div>
        <a href="#" class="me-3 small">Privacy</a>
        <a href="#" class="small">Terms</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('year2').textContent = new Date().getFullYear();
    initBookstore();
    // wire up search/filters
    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('categoryFilter').addEventListener('change', applyFilters);
    document.getElementById('clearFilters').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = '';
      applyFilters();
    });
  </script>
</body>
</html>
